<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Category Checker</title>
<script src="categories-config.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#e2e5ea;--ac:#2457d6;
--ok:#137a3d;--okb:#e3f5ea;--bad:#b42318;--badb:#fde8e6;--warn:#8a5a00;--warnb:#fff3d6;--sk:#555;--skb:#ececec}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e9ecf1;--mu:#98a2b3;--bd:#2c3340;--ac:#6d96ff;
--ok:#59d98a;--okb:#16372a;--bad:#ff8b80;--badb:#4a1f1b;--warn:#ffcc66;--warnb:#44350f;--sk:#bbb;--skb:#2c3038}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:20px 20px 4px;max-width:1300px;margin:auto}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu)}
main{max-width:1300px;margin:auto;padding:12px 20px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
#drop{border:2px dashed var(--bd);text-align:center;padding:28px;cursor:pointer}
#drop.over{border-color:var(--ac);background:var(--card)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-bottom:14px}
.two h3{margin:0 0 8px;font-size:14px}.two table{width:100%}.two td{padding:3px 0;border:0}.two td:last-child{text-align:right;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{border-radius:20px;padding:5px 12px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=search]{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.wrap{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
#tbl{border-collapse:collapse;width:100%;white-space:nowrap}
#tbl th{position:sticky;top:0;background:var(--card);text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);z-index:1}
#tbl td{padding:7px 10px;border-bottom:1px solid var(--bd)}
tr.WRONG td{background:var(--badb)}
.tag{padding:2px 9px;border-radius:12px;font-weight:600;font-size:12px}
.tag.OK{background:var(--okb);color:var(--ok)}.tag.WRONG{background:var(--bad);color:#fff}
.tag.NOTLIST{background:var(--warnb);color:var(--warn)}.tag.SKIP{background:var(--skb);color:var(--sk)}
.fix{font-weight:700;color:var(--ok)}.mu{color:var(--mu)}
#msg{margin:10px 0;color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>Emergency Category Checker</h1>
  <p>CSV upload karein — har trip ki category standard list se check hogi. Standard list <code>categories-config.js</code> main hai.</p>
</header>
<main>
  <div id="msg"></div>
  <div id="drop" class="card">
    <p><b>CSV file yahan drop karein</b> ya <button class="p" id="pick">File select karein</button></p>
    <p class="mu" id="fname"></p>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>

  <div id="result" hidden>
    <div class="grid" id="stats"></div>
    <div class="two">
      <div class="card"><h3>Agent wise WRONG category</h3><table id="agents"></table></div>
      <div class="card"><h3>Subtypes jo standard list main nahi mile</h3><table id="unmapped"></table></div>
    </div>
    <div class="bar">
      <span id="chips"></span>
      <input type="search" id="q" placeholder="Search: EC No, subtype, agent, tehsil...">
      <button class="p" id="dlAll">Download full CSV</button>
      <button id="dlBad">Download WRONG only</button>
    </div>
    <div class="wrap"><table id="tbl"></table></div>
  </div>
</main>

<script>
// CORE START
const CFG = window.CATEGORY_CONFIG;
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '');

function parseCSV(t) {
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows.filter(x => x.length > 1 || (x[0] || '').trim() !== '');
}

function buildLookup() {
  const std = {}, ali = {};
  for (const [cat, items] of Object.entries(CFG.categories))
    for (const it of items) { const k = norm(it); (std[k] = std[k] || { name: it, cats: [] }).cats.push(cat); }
  for (const [k, v] of Object.entries(CFG.aliases || {})) ali[norm(k)] = norm(v);
  return k => std[k] || std[ali[k]];
}

function analyse(rows) {
  const C = CFG.columns, O = CFG.outputColumns, head = rows[0].map(h => h.trim());
  const ix = n => head.indexOf(n);
  const iSub = ix(C.subtype), iCat = ix(C.category);
  if (iSub < 0 || iCat < 0) throw new Error('CSV main "' + C.subtype + '" ya "' + C.category + '" column nahi mila.');
  const find = buildLookup(), skipT = CFG.skipEmergencyTypes.map(norm), skipC = CFG.skipCategories.map(norm);
  const get = (r, n) => { const i = ix(n); return i < 0 ? '' : (r[i] || '').trim(); };
  const out = [];
  for (const r of rows.slice(1)) {
    const sub = (r[iSub] || '').trim(), cat = (r[iCat] || '').trim();
    let status, correct = '';
    if (skipT.includes(norm(get(r, C.type))) || skipC.includes(norm(cat))) status = 'SKIP';
    else {
      const hit = find(norm(sub));
      if (!hit) status = 'NOTLIST';
      else if (hit.cats.map(norm).includes(norm(cat))) status = 'OK';
      else { status = 'WRONG'; correct = hit.cats.join(' / '); }
    }
    out.push({ r, sub, cat, status, correct, id: get(r, C.id), type: get(r, C.type), agent: get(r, C.agent),
      agentId: get(r, C.agentId), tehsil: get(r, C.tehsil), recv: get(r, C.received) });
  }
  return { head, out, O };
}
// CORE END

const LABEL = { OK: 'Correct', WRONG: 'WRONG', NOTLIST: 'Not in list', SKIP: 'Skipped (PTS)' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let D = null, filter = 'ALL';

function toCSV(head, items, O) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [[...head, O.status, O.correct].map(q).join(',')];
  for (const x of items) lines.push([...head.map((_, i) => x.r[i] || ''), LABEL[x.status], x.correct].map(q).join(','));
  return '\ufeff' + lines.join('\r\n');
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function tally(items, key) {
  const m = {}; items.forEach(x => { const k = key(x); m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function rowsHTML(list) {
  return list.length ? list.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('') : '<tr><td class="mu">Koi nahi</td></tr>';
}

function render() {
  const { out } = D, n = s => out.filter(x => x.status === s).length, checked = out.length - n('SKIP');
  $('stats').innerHTML = [
    ['Total trips', out.length, ''], ['Checked', checked, ''],
    ['Correct', n('OK'), 'color:var(--ok)'], ['WRONG', n('WRONG'), 'color:var(--bad)'],
    ['Not in list', n('NOTLIST'), 'color:var(--warn)'], ['Skipped (PTS)', n('SKIP'), 'color:var(--mu)']
  ].map(([l, v, s]) => `<div class="card stat"><b style="${s}">${v}</b><span>${l}</span></div>`).join('');
  $('agents').innerHTML = rowsHTML(tally(out.filter(x => x.status === 'WRONG'), x => (x.agent || '—') + (x.agentId ? ' (' + x.agentId + ')' : '')).slice(0, 10));
  $('unmapped').innerHTML = rowsHTML(tally(out.filter(x => x.status === 'NOTLIST'), x => x.sub || '(empty)'));
  $('chips').innerHTML = ['ALL', 'WRONG', 'OK', 'NOTLIST', 'SKIP'].map(f =>
    `<button class="chip ${filter === f ? 'on' : ''}" data-f="${f}">${f === 'ALL' ? 'All' : LABEL[f]}</button>`).join(' ');
  const term = $('q').value.trim().toLowerCase();
  const list = out.filter(x => (filter === 'ALL' || x.status === filter) &&
    (!term || [x.id, x.sub, x.cat, x.agent, x.agentId, x.tehsil, x.correct].join(' ').toLowerCase().includes(term)));
  $('tbl').innerHTML = '<thead><tr><th>#</th><th>EC No</th><th>Tehsil</th><th>Subtype</th><th>Selected category</th><th>Correct category</th><th>Result</th><th>Agent</th><th>Call received</th></tr></thead><tbody>' +
    list.map((x, i) => `<tr class="${x.status}"><td class="mu">${i + 1}</td><td>${esc(x.id)}</td><td>${esc(x.tehsil)}</td><td>${esc(x.sub)}</td><td>${esc(x.cat)}</td>
    <td class="fix">${esc(x.correct)}</td><td><span class="tag ${x.status}">${LABEL[x.status]}</span></td>
    <td>${esc(x.agent)} <span class="mu">${esc(x.agentId)}</span></td><td class="mu">${esc(x.recv)}</td></tr>`).join('') +
    (list.length ? '' : '<tr><td colspan="9" class="mu">Koi record nahi mila.</td></tr>') + '</tbody>';
}

function load(file) {
  $('msg').textContent = '';
  const rd = new FileReader();
  rd.onload = () => {
    try {
      D = analyse(parseCSV(rd.result)); filter = 'ALL'; $('q').value = '';
      $('fname').textContent = file.name; $('result').hidden = false; render();
    } catch (e) { $('msg').textContent = e.message; }
  };
  rd.readAsText(file, 'utf-8');
}

if (!CFG) $('msg').textContent = 'categories-config.js load nahi hui. Dono files ek hi folder main rakhein.';
$('pick').onclick = e => { e.stopPropagation(); $('file').click(); };
$('drop').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && load(e.target.files[0]);
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => e.dataTransfer.files[0] && load(e.dataTransfer.files[0]));
$('chips').onclick = e => { if (e.target.dataset.f) { filter = e.target.dataset.f; render(); } };
$('q').oninput = render;
$('dlAll').onclick = () => download('emergency_trips_checked.csv', toCSV(D.head, D.out, D.O));
$('dlBad').onclick = () => download('emergency_trips_WRONG_only.csv', toCSV(D.head, D.out.filter(x => x.status === 'WRONG'), D.O));
</script>
</body>
</html>
